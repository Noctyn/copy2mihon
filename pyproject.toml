[project]
name = "copy2mihon"
version = "0.1.0"
description = "Export CopyManga bookshelf and reading history to Mihon backup (.tachibk)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "protobuf>=4.25.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.scripts]
copy2mihon = "copy2mihon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
